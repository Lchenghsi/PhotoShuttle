<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简单传 · 服务未运行</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #3aa0ff, #0060df);
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #fff;
  }
  .box { text-align: center; padding: 40px 48px; }
  .icon { font-size: 52px; }
  h1 { font-size: 20px; margin: 14px 0 8px; }
  p { margin: 0 0 22px; opacity: .92; font-size: 14px; }
  button {
    border: 0; cursor: pointer; border-radius: 10px; padding: 10px 28px;
    font-size: 15px; font-weight: 600; background: #fff; color: #0060df;
  }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📴</div>
    <h1>简单传服务未运行</h1>
    <p>请双击桌面上的「简单传」图标启动服务，<br>然后点击下面的按钮重试。</p>
    <button onclick="location.reload()">重试</button>
  </div>
</body>
</html>
